<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>MXLSHOP</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600&family=Kanit:wght@400;600&family=Sarabun:wght@400;600&family=Mitr:wght@400;600&family=Chakra+Petch:wght@400;600&family=Noto+Sans+Thai+Looped:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080b;--fg:#eceef2;--mut:#9aa0ac;--card:#12141a;--bd:#262a33;--ac:#c9d3e6;--btn:#e8edf7;--btx:#0a0b0f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f3f7;--fg:#14161c;--mut:#5b6270;--card:#fff;--bd:#d9dde6;--ac:#2b3550;--btn:#1b2338;--btx:#fff}}
:root[data-theme="light"]{--bg:#f1f3f7;--fg:#14161c;--mut:#5b6270;--card:#fff;--bd:#d9dde6;--ac:#2b3550;--btn:#1b2338;--btx:#fff}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f,"Prompt"),"Noto Sans Thai",system-ui,sans-serif}
#bgl{position:fixed;inset:0;z-index:-1;background:center/cover;opacity:.25}
nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav b{font-size:18px;letter-spacing:2px;margin-right:auto;display:flex;align-items:center;gap:8px}nav img,.hero img{filter:drop-shadow(0 1px 3px #0007)}nav img{height:34px}
.mq{overflow:hidden;white-space:nowrap;border-bottom:1px solid var(--bd);background:var(--card);color:var(--ac)}.mq span{display:inline-block;padding:6px 0 6px 100%;animation:mq 18s linear infinite}@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.coin{height:1.25em;vertical-align:-.28em;margin-right:4px}.cr{display:flex;align-items:center;font-weight:600}
button,.b{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:7px 13px;border-radius:9px}button:disabled{opacity:.45;cursor:default}
.p{background:var(--btn);color:var(--btx);border-color:var(--btn);font-weight:600}.r{color:#e5484d}.on{border-color:var(--ac)}
main{max-width:1000px;margin:0 auto;padding:18px 16px 60px}
.hero{text-align:center;padding:20px 0}.hero img{width:min(320px,80%)}.hero h1{margin:6px 0;font-size:30px;letter-spacing:5px}.mut{color:var(--mut)}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:8px}.g .c{margin:0}.c img,.ph{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:9px;background:var(--bd);display:block}.c img.coin{width:auto;aspect-ratio:auto;display:inline;background:none}
.c h3{margin:8px 0 2px;font-size:16px}.pr{color:var(--ac);font-weight:700}.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
input,textarea,select{width:100%;font:inherit;padding:8px 10px;border-radius:9px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);margin:4px 0 8px}
#m{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:14px;z-index:20}#m>div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;max-width:460px;width:100%;max-height:90%;overflow:auto}
table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}.tbl{overflow-x:auto}
pre{background:var(--bg);padding:10px;border-radius:9px;white-space:pre-wrap;word-break:break-all;margin:6px 0}
#t{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--btn);color:var(--btx);padding:9px 16px;border-radius:9px;display:none;z-index:30}
.tb{flex:1 0 100%;display:flex;gap:6px;flex-wrap:wrap}
.bn{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:6px 0 16px}.bi{position:relative;flex:0 0 auto;max-width:100%;scroll-snap-align:start;cursor:pointer}.bi img{display:block;max-width:100%;width:auto;object-fit:cover;border-radius:12px}.bi span{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;background:linear-gradient(transparent,#000b);color:#fff;border-radius:0 0 12px 12px}
#mb{position:fixed;right:14px;bottom:14px;z-index:9;display:none}input[type=range]{padding:0}
.av{border-radius:50%;object-fit:cover;display:inline-block;text-align:center;background:var(--bd);color:var(--fg);flex:none;vertical-align:middle}.c img.av{border-radius:50%}.c img.th{width:36px;height:36px;aspect-ratio:1;display:inline-block;vertical-align:middle;margin-right:6px}
.pg{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0}.pg i{display:block;height:100%;background:var(--ac)}
.wh{position:relative;width:min(320px,92%);margin:12px auto}.wh canvas{width:100%;display:block;border-radius:50%}.pt{position:absolute;top:-10px;left:50%;margin-left:-12px;border:12px solid transparent;border-top:24px solid #e5484d;z-index:2}
.bx{position:relative;overflow:hidden;border:1px solid var(--bd);border-radius:12px;background:var(--card);height:150px;margin:12px 0}.bx .mk{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1px;background:#e5484d;z-index:2}.st{display:flex;height:100%;will-change:transform}
.tile{flex:0 0 112px;margin:0 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;text-align:center;overflow:hidden}.tile img{width:84px;height:84px;object-fit:cover;border-radius:10px}.tile .ti{width:84px;height:84px;display:flex;align-items:center;justify-content:center;font-size:36px;background:var(--bd);border-radius:10px}
.s-rect{border-radius:0!important}.s-round{border-radius:12px!important}.s-circle{border-radius:50%!important;aspect-ratio:1/1!important}.bi img.s-circle{width:auto!important}.bi.cc span{position:static;background:none;color:var(--fg);text-align:center;display:block;padding:6px 0}
.pms{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:8px 0 14px}.pmb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:14px 8px;text-align:center}.pmb .pi{font-size:30px;line-height:1}.pmb small{color:var(--mut);font-size:11px}
@media(max-width:640px){
nav{padding:8px 10px;gap:5px}nav button{padding:6px 10px;font-size:14px}nav b{font-size:15px;letter-spacing:1px}nav img{height:28px}.hm{display:none}
.tb{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}.tb::-webkit-scrollbar{display:none}.tb button{flex:none;white-space:nowrap}
main{padding:12px 10px 60px}.hero{padding:8px 0}.hero img{width:min(220px,62%)!important}.hero h1{font-size:22px;letter-spacing:3px}
.mq span{padding-top:4px;padding-bottom:4px}}
@media(max-width:520px){.g{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px}.c{padding:8px}.c h3{font-size:14px;margin-top:6px}.c .row button{padding:6px 8px;font-size:13px}.pr{font-size:14px}h2{font-size:20px}}
</style></head><body><div id="bgl"></div><div id="app"></div><div id="m" onclick="if(event.target==this)cm()"><div></div></div><div id="t"></div><button id="mb" class="p" onclick="mt()"></button>

async function mc(){const r=await A_('/api/admin/code',{op:'create',code:$('#m1').value,pct:+$('#m2').value,max:+$('#m3').value||0,exp:$('#m4').value});if(r)toast('สร้างโค้ดแล้ว: '+r.code)}
function ct(c){return A_('/api/admin/code',{op:'toggle',code:c})}
function cx(c){return A_('/api/admin/code',{op:'delete',code:c})}
function wipe(k){if(!confirm('ยืนยันการลบ? ย้อนกลับไม่ได้'))return;return A_('/api/admin/wipe',{k},'ลบแล้ว')}
function du(u){if(!confirm('ลบสมาชิก '+u+' พร้อมประวัติทั้งหมดของเขา?'))return;return A_('/api/admin/user/delete',{u},'ลบสมาชิกแล้ว')}
async function ss(){const c=S.cfg;c.news=$('#c1').value;c.sp=+$('#c4').value;c.font=$('#c5').value;c.tn=$('#c6').value;c.contact=$('#c3').value;c.lg=+$('#c9').value||320;c.ms=+$('#c10').value||14;c.shb=$('#c11').value;c.shc=$('#c12').value;c.sht=$('#c13').value;c.gw=+$('#c14').value||210;c.wa=$('#c15').value=='1';c.wn=Math.max(1,+$('#c16').value||5);c.mUrl=$('#c8').value.trim();if(F.bg)c.bg=F.bg;delete F.bg;save();await mset();render();toast('บันทึกแล้ว')}
{const ep0=ep,pe0=pe;ep=async function(id,ch){try{await refresh(true)}catch(e){}return ep0(id,ch)};pe=async function(k,id){try{await refresh(true)}catch(e){}return pe0(k,id)}}
/* music / backup */
async function mup(e){const f=e.target.files[0];if(!f)return;if(f.size>15e6)return toast('ไฟล์ใหญ่เกิน 15 MB');try{const r=await fetch('/api/admin/music',{method:'PUT',headers:{Authorization:'Bearer '+TK,'X-Filename':encodeURIComponent(f.name),'Content-Type':'application/octet-stream'},body:f}),j=await r.json();if(!r.ok)throw new Error(j.e);await refresh(true);await mset();render();toast('อัปโหลดเพลงแล้ว')}catch(x){toast(x.message||'อัปโหลดไม่สำเร็จ')}}
async function mrm(){try{await api('/api/admin/music',null,'DELETE')}catch(e){}await refresh(true);await mset();render()}
async function bk(){try{const r=await fetch('/api/admin/backup',{headers:{Authorization:'Bearer '+TK}});if(!r.ok)throw 0;const b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mxlshop-db-'+dk(Date.now())+'.json';document.body.appendChild(a);a.click();a.remove();toast('ดาวน์โหลดไฟล์ข้อมูลแล้ว')}catch(e){toast('ดาวน์โหลดไม่สำเร็จ')}}
async function bkc(){try{const r=await api('/api/admin/backup');await navigator.clipboard.writeText(JSON.stringify(r));toast('คัดลอกข้อมูลแล้ว')}catch(e){toast('คัดลอกไม่ได้ ใช้ปุ่มดาวน์โหลดแทน')}}
async function restore(txt){let d;try{d=JSON.parse(txt)}catch(e){return toast('ข้อมูลสำรองไม่ถูกต้อง')}if(!d||!Array.isArray(d.users)||!Array.isArray(d.products)||!d.cfg)return toast('ข้อมูลสำรองไม่ถูกต้อง');if(!confirm('กู้คืนข้อมูล? ข้อมูลปัจจุบันจะถูกแทนที่'))return;try{const r=await api('/api/admin/restore',{data:d});await refresh(true);render();toast(r.note||'กู้คืนข้อมูลแล้ว')}catch(e){toast(e.message)}}
init();
</script></body></html>
